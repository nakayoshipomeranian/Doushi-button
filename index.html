<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😈れめさめ大好きボタン☔️</title>

<style>
body{
  font-family: sans-serif;
  background:#faf8f5;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.card{
  background:white;
  padding:30px;
  border-radius:16px;
  width:90%;
  max-width:500px;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

button{
  padding:14px 24px;
  font-size:18px;
  border-radius:999px;
  border:none;
  cursor:pointer;
  margin-top:20px;
}

.message{
  margin-top:20px;
  min-height:40px;
}

.count{
  margin-top:15px;
  font-size:14px;
  color:#666;
}
</style>

</head>

<body>

<div class="card">

<h1>😈れめさめ大好きボタン☔️</h1>

<p>
れめさめが好きな方へ。<br>
ただ「れめさめ大好き！」と思った時に押すためのボタンです。
</p>

<button id="btn">れめさめ大好き！</button>

<div class="message" id="msg"></div>

<div class="count" id="count">
読み込み中...
</div>

</div>

<!-- Firebase -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFkIeLQkAhdyAvEE2ADHJQFotz8aDVejI",
  authDomain: "doushi-button.firebaseapp.com",
  projectId: "doushi-button",
  storageBucket: "doushi-button.firebasestorage.app",
  messagingSenderId: "221646366483",
  appId: "1:221646366483:web:fa7fd666f7f7c4cb15dce6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ref = doc(db, "doushi", "counter");

// 初期化
async function init(){
  const snap = await getDoc(ref);
  if(!snap.exists()){
    await setDoc(ref, {count:0});
  }
  load();
}

// 表示
async function load(){
  const snap = await getDoc(ref);
  const data = snap.data();
  document.getElementById("count").innerText =
    `現在 ${data.count} 回れめさめが愛されました`;
}

// クリック
document.getElementById("btn").addEventListener("click", async () => {

  await updateDoc(ref, {
    count: increment(1)
  });

  document.getElementById("btn").addEventListener("click", async () => {

  await updateDoc(ref, {
    count: increment(1)
  });

  const messages = [
    "❤️ ありがとう！同じ気持ちです！",
    "🩷 れめさめって、良いですよね……。",
    "💙 一緒にずっと大好きでいましょう！"
  ];

  const randomMessage = messages[Math.floor(Math.random() * messages.length)];
  document.getElementById("msg").innerText = randomMessage;

  load();
});

init();

</script>

</body>
</html>
