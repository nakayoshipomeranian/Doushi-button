<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>れめさめ大好きボタン</title>

<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:#fdfbf8;
    color:#333;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.card{
    width:90%;
    max-width:520px;
    background:white;
    border-radius:18px;
    padding:32px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
    text-align:center;
}

h1{
    font-size:28px;
    margin-top:0;
}

p{
    line-height:1.8;
}

button{
    margin-top:20px;
    padding:14px 28px;
    border:none;
    border-radius:999px;
    font-size:18px;
    cursor:pointer;
}

.count{
    margin-top:24px;
    font-size:14px;
    color:#777;
}

.message{
    margin-top:24px;
    min-height:40px;
}
</style>

</head>

<body>

<div class="card">

<h1>🤝 れめさめ大好きボタン</h1>

<p>

れめさめが好きな方へ。<br><br>

これは作品への評価ではなく、<br>
<strong>「れめさめ大好き」</strong>の気持ちを送るボタンです。

</p>

<button>

🤝 だいすき握手

</button>

<div class="message">

😈☔<br><br>

ありがとう！<br>

私も同じ気持ちです。

</div>

<div class="count">

現在 -- 人がれめさめ大好きです

</div>

</div>

</body>
</html>
